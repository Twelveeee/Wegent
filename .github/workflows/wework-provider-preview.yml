name: Wework Provider Preview

on:
  push:
    branches: [feature/wework-provider-yaml]
    paths:
      - .github/workflows/wework-provider-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wework-provider-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Source and verification tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated test tools
        run: |
          mkdir -p verification-tools
          npm install --prefix verification-tools --ignore-scripts yaml@2.9.0 vitest@4.1.7 typescript@6.0.2 @types/node@24.13.3 react@19.2.6 react-dom@19.2.6 @types/react@19.2.14 @types/react-dom@19.2.3 jsdom@28.1.0 @testing-library/react@16.3.2 @testing-library/jest-dom@6.9.1 @testing-library/user-event@14.6.1 lucide-react@1.16.0 prettier@3.8.4
          tar -czf verification-tools.tar.gz verification-tools
          git archive --format=tar.gz HEAD -o wework-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wework-provider-source-and-tools
          path: |
            wework-source.tar.gz
            verification-tools.tar.gz
          retention-days: 7
          if-no-files-found: error
  prepare:
    name: Prepare macOS arm64 toolchain
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            executor/target
          key: wework-provider-rust-arm64-${{ hashFiles('executor/Cargo.lock') }}
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            frontend/node_modules
            wework/node_modules
            packages/*/node_modules
            wework/electron/node_modules
          key: wework-provider-node-arm64-${{ hashFiles('pnpm-lock.yaml', 'wework/electron/pnpm-lock.yaml') }}
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir wework/electron install --frozen-lockfile
      - name: Build unchanged native executor
        run: cargo build --manifest-path executor/Cargo.toml --release --bin wegent-executor --target aarch64-apple-darwin
