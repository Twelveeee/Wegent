name: Wework Provider Preview
on:
  push:
    branches: [feature/wework-provider-yaml]
    paths: [.github/workflows/wework-provider-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wework-provider-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source and verification tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare isolated test tools
        run: |
          mkdir -p "$RUNNER_TEMP/verification-tools"
          cd "$RUNNER_TEMP/verification-tools"
          printf '{"private":true,"name":"wework-verification-tools","version":"1.0.0"}\n' > package.json
          npm install --ignore-scripts --legacy-peer-deps yaml@2.9.0 vitest@4.1.7 typescript@6.0.2 @types/node@24.13.3 react@19.2.6 react-dom@19.2.6 @types/react@19.2.14 @types/react-dom@19.2.3 jsdom@28.1.0 @testing-library/dom@10.4.1 @testing-library/react@16.3.2 @testing-library/jest-dom@6.9.1 @testing-library/user-event@14.6.1 lucide-react@1.16.0 prettier@3.8.4
          cd "$GITHUB_WORKSPACE"
          tar -czf verification-tools.tar.gz -C "$RUNNER_TEMP" verification-tools
          git archive --format=tar.gz HEAD -o wework-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wework-provider-source-and-tools
          path: |
            wework-source.tar.gz
            verification-tools.tar.gz
          retention-days: 7
          if-no-files-found: error
