name: Wework Provider Preview

on:
  push:
    branches: [feature/wework-provider-yaml-arm64]
    paths:
      - .github/workflows/wework-provider-preview.yml
      - wework/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wework-provider-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Prepare verified source
    if: github.ref == 'refs/heads/feature/wework-provider-yaml-arm64'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Materialize reviewed follow-up
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/provider-followup.patch; then
            echo 'fc7e9d499a67e1c17c682860afff6c10af8c3f9b2dc8bb6a202fbf77a0acb82d  .github/provider-followup.patch' | sha256sum -c -
            git apply --check .github/provider-followup.patch
            git apply .github/provider-followup.patch
            git rm .github/provider-followup.patch .github/provider-followup.b64
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add wework
            git diff --cached --check
            git commit -m 'fix(wework): preserve preset capabilities and isolate provider preview updates'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git archive --format=tar.gz HEAD -o wework-provider-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wework-provider-verified-source
          path: wework-provider-source.tar.gz
          retention-days: 14
          if-no-files-found: error

  macos-arm64:
    name: Verify and package macOS arm64
    needs: source
    runs-on: macos-14
    timeout-minutes: 75
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      WEWORK_ELECTRON_DEPENDENCIES_READY: 'true'
      WEWORK_EXECUTOR_PATH: ${{ github.workspace }}/executor/target/aarch64-apple-darwin/release/wegent-executor
      WEWORK_SOURCE_SHA: ${{ needs.source.outputs.source_sha }}
      WEWORK_RELEASE_PLATFORM: macos
      WEWORK_RELEASE_ARCH: arm64
      WEWORK_CODEX_TARGET: aarch64-apple-darwin
      WEWORK_DWS_TARGET: aarch64-apple-darwin
      VITE_WEWORK_RUNTIME_MODE: local-first
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.source_sha }}
      - uses: ./.github/actions/setup-node-workspace
        with:
          save-cache: 'true'
      - name: Install desktop host dependencies
        run: pnpm --dir wework/electron install --frozen-lockfile
      - uses: actions/cache/restore@v4
        id: executor
        with:
          path: executor/target/aarch64-apple-darwin/release/wegent-executor
          key: provider-executor-arm64-01971fc-v1
      - uses: dtolnay/rust-toolchain@stable
        if: steps.executor.outputs.cache-hit != 'true'
        with:
          targets: aarch64-apple-darwin
      - name: Build native executor when cache is unavailable
        if: steps.executor.outputs.cache-hit != 'true'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/executor/target
        run: cargo build --locked --release --manifest-path executor/Cargo.toml --bin wegent-executor --target aarch64-apple-darwin
      - uses: actions/cache/save@v4
        if: steps.executor.outputs.cache-hit != 'true'
        with:
          path: executor/target/aarch64-apple-darwin/release/wegent-executor
          key: provider-executor-arm64-01971fc-v1
      - name: Typecheck renderer and desktop host
        run: |
          set -euo pipefail
          mkdir -p preview-results
          pnpm --filter wework typecheck 2>&1 | tee preview-results/typecheck-renderer.log
          pnpm --dir wework/electron typecheck 2>&1 | tee preview-results/typecheck-host.log
      - name: Test provider UI, migration, existing models and cloud compatibility
        run: |
          set -euo pipefail
          pnpm --filter wework test src/features/model-settings src/components/settings/ProviderSettingsSection.test.tsx src/components/settings/ModelSettingsPage.test.tsx src/api/hybrid/hybridServices.test.ts src/api/local/localServices.test.ts --maxWorkers=2 2>&1 | tee preview-results/tests-renderer.log
          pnpm --dir wework/electron test src/host/model-config-store.test.ts src/host/capability-router.test.ts src/host/electron-capabilities.test.ts --maxWorkers=2 2>&1 | tee preview-results/tests-host.log
      - name: Check changed feature source
        run: |
          set -euo pipefail
          pnpm --filter wework exec eslint src/features/model-settings/providerConfig.ts src/features/model-settings/providerConfigState.ts src/features/model-settings/ProviderConfigSync.tsx src/features/model-settings/providerConfig.test.ts src/features/model-settings/localModelSettings.ts src/components/settings/ProviderSettingsSection.tsx src/components/settings/ProviderSettingsSection.test.tsx 2>&1 | tee preview-results/lint.log
          git diff --check
      - name: Build arm64 desktop application
        run: |
          set -euo pipefail
          node wework/scripts/prepare-electron.mjs 2>&1 | tee preview-results/electron-prepare.log
          pnpm --dir wework/electron build:package 2>&1 | tee preview-results/build.log
      - name: Verify application and produce installer
        run: |
          set -euo pipefail
          app="wework/electron/release/WeWork-darwin-arm64/WeWork.app"
          test -d "$app"
          file "$app/Contents/MacOS/WeWork" | tee preview-results/architecture.log
          grep -q arm64 preview-results/architecture.log
          codesign --verify --deep --strict --verbose=2 "$app" 2>&1 | tee preview-results/codesign.log
          mkdir -p "$RUNNER_TEMP/provider-dmg" preview-artifacts
          mv "$app" "$RUNNER_TEMP/provider-dmg/WeWork.app"
          ln -s /Applications "$RUNNER_TEMP/provider-dmg/Applications"
          hdiutil create -volname 'WeWork Provider Preview' -srcfolder "$RUNNER_TEMP/provider-dmg" -ov -format UDZO preview-artifacts/WeWork-0.5.4-provider.1-macos-arm64.dmg
          shasum -a 256 preview-artifacts/*.dmg > preview-artifacts/SHA256SUMS.txt
          printf 'Version: 0.5.4-provider.1\nSource: %s\nRun: https://github.com/%s/actions/runs/%s\nArchitecture: macOS arm64\nSigning: ad-hoc; not notarized\nChannel: preview artifact only; no stable updater publication\n' "$WEWORK_SOURCE_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > preview-artifacts/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WeWork-0.5.4-provider.1-macos-arm64
          path: preview-artifacts/
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wework-provider-preview-verification
          path: preview-results/
          retention-days: 14
          if-no-files-found: warn
