name: Wework Provider Test Build

# The push trigger allows the first build without changing the fork's default branch.
on:
  push:
    branches:
      - fix/wework-provider-file-settings-build
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wework-provider-test-build-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test-build:
    name: Verify Provider settings and build macOS arm64 test DMG
    if: github.repository == 'Twelveeee/Wegent' && github.ref == 'refs/heads/fix/wework-provider-file-settings-build'
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=8192
      CARGO_BUILD_TARGET: aarch64-apple-darwin
      WEWORK_RELEASE_PLATFORM: macos
      WEWORK_RELEASE_ARCH: arm64
      WEWORK_CODEX_TARGET: aarch64-apple-darwin
      WEWORK_DWS_TARGET: aarch64-apple-darwin
      WEWORK_EXECUTOR_PROFILE: release
      WEWORK_ELECTRON_DEPENDENCIES_READY: "true"
      VITE_WEWORK_RUNTIME_MODE: local-first
      VITE_WEWORK_E2E: "false"
      VITE_WEWORK_RELEASE_CHANNEL: beta
      WEWORK_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner and source identity
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$WEWORK_SOURCE_SHA"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: aarch64-apple-darwin

      - name: Set up compiler cache
        uses: ./.github/actions/setup-sccache
        with:
          save-cache: "true"

      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          architecture: arm64
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            wework/electron/pnpm-lock.yaml

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir wework/electron install --frozen-lockfile

      - name: Set up Bash for CI routing checks
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

      - name: Check Provider settings and native file configuration
        run: |
          pnpm --filter wework typecheck
          pnpm --dir wework/electron typecheck
          pnpm --filter wework exec eslint \
            src/components/settings/ProviderSettingsSection.tsx \
            src/components/settings/ProviderSettingsSection.test.tsx \
            electron/src/host/model-configuration-store.test.ts
          pnpm --filter wework run lint:typography
          pnpm --filter wework test \
            src/components/settings/ProviderSettingsSection.test.tsx \
            src/components/settings/ModelSettingsPage.test.tsx \
            src/features/model-settings/providerModelConfiguration.test.ts
          pnpm --dir wework/electron test src/host/model-configuration-store.test.ts
          bash .github/scripts/test-classify-ci-changes.sh
          node --check wework/e2e/desktop/scenarios/provider-file-settings.mjs

      - name: Check model selection regressions
        run: |
          pnpm --filter wework test \
            src/lib/model-ui.test.ts \
            src/features/workbench/runtimeModelSelection.test.ts
          pnpm --filter @wegent/collaboration test src/controls/ModelSelector.test.tsx

      - uses: astral-sh/setup-uv@v6

      - name: Check shared model catalog aliases
        run: uv run --no-project --with pytest pytest shared/tests/test_codex_model_catalog.py -q

      - name: Prepare and compile desktop application
        run: |
          pnpm --filter wework prepare:electron
          pnpm --dir wework/electron prepare:package
          pnpm --dir wework/electron build

      - name: Package full ad-hoc signed ARM64 DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          node --input-type=module -e \
            "import { prepareSignedComponents } from './wework/electron/scripts/prepare-signed-components.mjs'; await prepareSignedComponents()"
          pnpm --dir wework/electron exec electron-builder \
            --config electron-builder.config.cjs --mac dmg --arm64 --publish never \
            --config.mac.identity=- --config.mac.notarize=false

      - name: Verify installer and record source
        run: |
          set -euo pipefail
          app=wework/electron/release-installer/mac-arm64/WeWork.app
          codesign --verify --deep --strict "$app"
          lipo "$app/Contents/MacOS/WeWork" -verify_arch arm64
          for disk in wework/electron/release-installer/*.dmg; do
            hdiutil verify "$disk"
          done
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const { version } = JSON.parse(readFileSync('wework/package.json', 'utf8'))
          writeFileSync('wework/electron/release-installer/BUILD-INFO.txt', [
            `Source: ${process.env.GITHUB_SHA}`,
            `Version: ${version}`,
            `Workflow run: ${process.env.GITHUB_RUN_ID}`,
            'Architecture: macOS arm64',
            'Executor profile: release',
            'Package: full self-contained test installer',
            'Signing: ad-hoc; not Apple Developer ID signed or notarized',
            'Release publishing and update channels: unchanged',
            '',
          ].join('\n'))
          NODE
          cd wework/electron/release-installer
          shasum -a 256 ./*.dmg > SHA256SUMS.txt

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: wework-test-macos-arm64-${{ github.run_id }}
          path: |
            wework/electron/release-installer/*.dmg
            wework/electron/release-installer/BUILD-INFO.txt
            wework/electron/release-installer/SHA256SUMS.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
